
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jungle Dungeon Explorer | Gold & Glory</title>
    <meta name="description" content="Explore the jungle dungeon, collect gold coins, and solve mazes in this addictive adventure game. Featuring day/night cycles and dynamic weather.">
    <meta name="keywords" content="game, maze, dungeon, jungle, coins, adventure, retro">
    <link rel="icon" href="https://picsum.photos/32/32?random=1">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            animation: {

            keyframes: {
              rain: {
                '0%': { transform: 'translateY(-20px)' },

              }
            }
          }
        }
      }
    </script>
